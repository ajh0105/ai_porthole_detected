services:
  db:
    image: postgis/postgis:15-3.4
    container_name: roadgis-db
    environment:
      POSTGRES_DB: roadgis
      POSTGRES_USER: roadgis
      POSTGRES_PASSWORD: roadgis1234
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roadgis -d roadgis"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
