spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/roadgis}
    username: ${SPRING_DATASOURCE_USERNAME:roadgis}
    password: ${SPRING_DATASOURCE_PASSWORD:roadgis1234}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.spatial.dialect.postgis.PostgisPG95Dialect
        format_sql: true
        jdbc:
          time_zone: Asia/Seoul
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 500MB

jwt:
  secret: ${JWT_SECRET:roadgis-jwt-secret-key-minimum-256-bits-long}
  expiration: 86400000       # 24시간 (ms)
  refresh-expiration: 604800000  # 7일 (ms)

ai:
  pipeline:
    url: ${AI_PIPELINE_URL:http://localhost:8000}

file:
  upload-dir: ${FILE_UPLOAD_DIR:./uploads}

server:
  port: 8080

logging:
  level:
    com.roadgis: DEBUG
    org.hibernate.SQL: WARN
